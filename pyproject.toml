[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clutch"
version = "0.1.0"
description = "NBA win probability from any moment in a game, with live and replay charts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "nba_api>=1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "joblib>=1.4",
]

[project.optional-dependencies]
# Torch is only needed to train the MLP. The deployed API loads the exported
# MLP weights with numpy, so Render doesn't have to install torch.
train = [
    "torch>=2.4",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "model*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
