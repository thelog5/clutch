# Render blueprint for Clutch: the API and the website, side by side in your
# Render account. In Render choose "New > Blueprint" and pick this repo; it
# creates the two services below and leaves any other services alone.
services:
  # The API: replay, live polling, model. Free instance (sleeps after 15
  # minutes idle, about a minute to wake). Change `plan` to `starter` ($7/mo)
  # to keep it awake.
  - type: web
    name: clutch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    # No server banner; client WebSocket messages are tiny commands, so cap them at 64 KB.
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --no-server-header --ws-max-size 65536
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Slim replay bundle committed by `make deploy-bundle` (last two seasons + current)
      - key: CLUTCH_API_DATA
        value: api/data
      - key: CLUTCH_ARTIFACTS
        value: model/artifacts
      # "nba" polls cdn.nba.com for live games; set to "off" if Render's IP is blocked
      - key: CLUTCH_LIVE_SOURCE
        value: nba
      # The site's address, https://clutchnba.onrender.com: only that site
      # can call the API from a browser or open its streams (docs/SECURITY.md).
      # Leave blank on the first deploy, fill in once the site exists.
      - key: CLUTCH_CORS_ORIGINS
        sync: false

  # The website: a static site, free on every Render plan.
  - type: web
    name: clutchnba
    runtime: static
    # --include=dev: the build needs Vite and TypeScript even if NODE_ENV=production is set
    buildCommand: cd web && npm ci --include=dev && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    buildFilter:
      paths:
        - web/**
    routes:
      # Single-page app: every path that isn't a file serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite puts a content hash in every asset file name, so they never change
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Security headers: keep in sync with web/security-headers.json (tests/test_deploy_config.py checks).
      # connect-src allows any *.onrender.com API; add your own domain there if you give the API one.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.nba.com; connect-src 'self' https://*.onrender.com wss://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # The clutch-api URL, e.g. https://clutch-api.onrender.com. It's baked in
      # at build time, so redeploy the site after setting or changing it.
      - key: VITE_API_URL
        sync: false
